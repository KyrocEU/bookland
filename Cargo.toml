[package]
name = "bookland"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
wgpu = { version = "25", default-features = false, features = ["metal"] }
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
winit = "0.30"
raw-window-handle = "0.6"
unicode-bidi = "0.3.18"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
cc = "1"

[profile.release]
strip = "symbols"
